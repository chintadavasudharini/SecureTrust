<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login | SecureTrust</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #e3e3e3;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: white;
        }

        .navbar a {
            color: #007bff;
            font-weight: bold;
        }

        .container {
            max-width: 400px;
            background-color: white;
            padding: 30px;
            margin: 50px auto;
            margin-top: 180px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.5s ease forwards;
        }

        h2 {
            font-weight: 700;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-control {
            margin-bottom: 15px;
            border-radius: 6px;
        }

        .btn-primary {
            width: 100%;
            border-radius: 6px;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 14px;
            color: #666;
        }

        @keyframes fadeIn {
            from {
                transform: translateY(50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand">SecureTrust</a>
            <div class="ms-auto">
                <a class="btn btn-outline-primary" href="{{ url_for('register') }}">Register</a>
            </div>
        </div>
    </nav>

    <!-- Login Form -->
    <div class="container">
        <h2>Login</h2>
        <!-- Flash Messages -->
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-info alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        
        <form method="POST">
            <input type="text" name="uname" class="form-control" placeholder="Username" required>
            <input type="password" name="password" class="form-control" placeholder="Password" required>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <p class="mt-3 text-center">New user? <a href="{{ url_for('register') }}">Register here</a></p>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>&copy; SecureTrust Services. All rights reserved.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
