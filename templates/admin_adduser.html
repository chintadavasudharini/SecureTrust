<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add User | SecureTrust</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e3e3e3;
        }

        .navbar {
            background-color: white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .navbar a {
            color: #007bff;
            font-weight: bold;
        }

        .title {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 20px;
            animation: fadeInDown 0.5s ease forwards;
            opacity: 0;
        }

        .title h2 {
            font-weight: 700;
            color: #333;
        }

        .form-container {
            background-color: white;
            max-width: 700px;
            margin: 0 auto 40px;
            padding: 30px;
            border-left: 6px solid #007bff;
            border-right: 6px solid #007bff;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            animation: slideIn 0.6s ease forwards;
            opacity: 0;
        }

        .form-section {
            margin-bottom: 30px;
        }

        .form-section h5 {
            font-weight: 600;
            color: #007bff;
            margin-bottom: 15px;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }

        @keyframes fadeInDown {
            0% {
                transform: translateY(-30px);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes slideIn {
            0% {
                transform: translateY(40px);
                opacity: 0;
            }

            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar (matching profile.html style) -->
    <nav class="navbar navbar-expand-lg px-4 py-2 shadow-sm bg-white">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-primary">SecureTrust</a>

            <div class="ms-auto d-flex align-items-center gap-3">
                <a class="nav-link fw-semibold" href="{{ url_for('admin_dashboard') }}">Dashboard</a>

                <!-- Profile Dropdown -->
                <div class="dropdown">
                    <button class="btn btn-outline-primary dropdown-toggle fw-bold" type="button" id="profileDropdown"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        Admin
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="profileDropdown">
                        <li class="px-3 py-2">
                            <div class="fw-semibold">{{ admin }}</div>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item" href="{{ url_for('admin_profile', admin=admin) }}"><i
                                    class="bi bi-person me-2"></i>View Profile</a></li>
                        <li><a class="dropdown-item" href="{{ url_for('admin_settings', admin=admin) }}"><i
                                    class="bi bi-gear me-2"></i>Settings</a></li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li><a class="dropdown-item text-danger" href="{{ url_for('logout') }}"><i
                                    class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Title -->
    <div class="title">
        <h2><i class="bi bi-person-plus me-2"></i>Add New User</h2>
        <p class="text-muted">Enter complete user information to create an account</p>
    </div>

    <!-- Add User Form -->
    <div class="form-container">
        <!-- Inside your <body>, replace <form> with the following -->
        <form method="POST" action="{{ url_for('adduser') }}">

            <!-- Personal Details -->
            <div class="form-section">
                <h5>Personal Details</h5>
                <div class="row g-3">
                    <div class="col-md-6"><input type="text" name="surname" class="form-control" placeholder="Surname"
                            required></div>
                    <div class="col-md-6"><input type="text" name="firstname" class="form-control"
                            placeholder="First Name" required></div>
                    <div class="col-md-6"><input type="text" name="middlename" class="form-control"
                            placeholder="Middle Name"></div>
                    <div class="col-md-6"><input type="text" name="lastname" class="form-control"
                            placeholder="Last Name"></div>
                    <div class="col-md-6"><input type="date" name="dob" class="form-control" required></div>
                    <div class="col-md-6">
                        <select name="gender" class="form-select" required>
                            <option value="" disabled selected>Gender</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Others</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Account Details -->
            <!-- <div class="form-section">
                <h5>Account Details</h5>
                <div class="row g-3">
                    <div class="col-md-6"><input type="text" name="account_number" class="form-control"
                            placeholder="Account Number" required></div>
                    <div class="col-md-6"><input type="text" name="upi_id" class="form-control"
                            placeholder="UPI ID (e.g., 9876543210@securetrust)" required></div>
                </div>
            </div> -->

            <!-- Identification Details -->
            <div class="form-section">
                <h5>Identification Details</h5>
                <div class="row g-3">
                    <div class="col-md-6"><input type="text" name="aadhar" class="form-control"
                            placeholder="Aadhar Number" required></div>
                    <div class="col-md-6"><input type="text" name="pan" class="form-control" placeholder="PAN Number"
                            required></div>
                </div>
            </div>

            <!-- Contact Details -->
            <div class="form-section">
                <h5>Contact Details</h5>
                <div class="row g-3">
                    <div class="col-md-6"><input type="text" name="mobile_number" class="form-control"
                            placeholder="Mobile Number" required></div>
                    <div class="col-md-6"><input type="email" name="email_id" class="form-control"
                            placeholder="Email ID" required></div>

                    <div class="col-md-6"><input type="text" name="flat_no" class="form-control" placeholder="Flat No."
                            required></div>

                    <div class="col-md-6"><input type="text" name="house_no" class="form-control"
                            placeholder="House No." required></div>
                    <div class="col-md-6"><input type="text" name="house_name" class="form-control"
                            placeholder="House Name." required></div>
                    <div class="col-md-6"><input type="text" name="street" class="form-control"
                            placeholder="Street Name" required></div>
                    <div class="col-md-6"><input type="text" name="area" class="form-control"
                            placeholder="Area/Locality" required></div>
                    <div class="col-md-6"><input type="text" name="pincode" class="form-control" placeholder="Pincode"
                            required></div>
                    <div class="col-md-4"><input type="text" name="city" class="form-control" placeholder="City"
                            required></div>
                    <div class="col-md-4"><input type="text" name="district" class="form-control" placeholder="District"
                            required></div>
                    <div class="col-md-4"><input type="text" name="state" class="form-control" placeholder="State"
                            required></div>
                    <div class="col-md-6"><input type="text" name="country" class="form-control" placeholder="Country"
                            required></div>

                </div>
            </div>

            <!-- Submit -->
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary px-4">Add User</button>
            </div>
        </form>

    </div>

    <!-- Footer -->
    <div class="footer">
        <p>&copy; SecureTrust Admin Panel. All rights reserved.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
