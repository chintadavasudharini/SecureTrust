<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" href="{{url_for('static', filename='body.css')}}">

</head>

<body>
    <div class="navbar">
        <div class="left">
            <a href="{{url_for('home')}}">Home</a>
        </div>
        <div class="center">
            <a href="{{url_for('dashboard',pusername=ausername)}}">Dashboard</a>
        </div>
        <div class="right">
            <a href="{{ url_for('profile', username=ausername) }}">Profile</a>
        </div>
    </div>
    <div class="container">
        <h1>Change Password</h1>
        <form id="passwordForm" method="POST">
            <input type="text" placeholder="Username" name="uname" required>
            <input type="password" placeholder="Current Password" name="cpassword" required>
            <input type="password" placeholder="New Password" name="npassword" required>
            <button type="submit" class="btn">Change Password</button>
        </form>
    </div>
    </div>

    </div>
</body>

</html>
