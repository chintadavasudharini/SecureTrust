<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>View User Info | SecureTrust Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e3e3e3;
    }

    .navbar {
      background-color: white;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .navbar a {
      color: #007bff;
      font-weight: bold;
    }

    .title {
      text-align: center;
      margin-top: 40px;
      margin-bottom: 20px;
    }

    .title h2 {
      font-weight: 700;
      color: #333;
    }

    .form-container {
      background-color: white;
      max-width: 700px;
      margin: 0 auto 40px;
      padding: 30px;
      border-left: 6px solid #007bff;
      border-right: 6px solid #007bff;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    .form-section {
      margin-bottom: 30px;
    }

    .form-section h5 {
      font-weight: 600;
      color: #007bff;
      margin-bottom: 15px;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #555;
    }

    textarea.form-control {
      resize: vertical;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg px-4 py-2 shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-primary">SecureTrust</a>

      <div class="ms-auto d-flex align-items-center gap-3">
        <a class="nav-link fw-semibold" href="{{ url_for('admin_dashboard') }}">Dashboard</a>
        <div class="dropdown">
          <button class="btn btn-outline-primary dropdown-toggle fw-bold" type="button" data-bs-toggle="dropdown">
            Admin
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow-sm">
            <li class="px-3 py-2">
              <div class="fw-semibold">{{ admin }}</div>
            </li>
            <li>
              <hr class="dropdown-divider">
            </li>
            <li><a class="dropdown-item" href="{{ url_for('admin_profile', admin=admin) }}"><i
                  class="bi bi-person me-2"></i>View Profile</a></li>
            <li><a class="dropdown-item" href="{{ url_for('admin_settings', admin=admin) }}"><i
                  class="bi bi-gear me-2"></i>Settings</a></li>
            <li>
              <hr class="dropdown-divider">
            </li>
            <li><a class="dropdown-item text-danger" href="{{ url_for('logout') }}"><i
                  class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <!-- Title -->
  <div class="title">
    <h2><i class="bi bi-person-lines-fill me-2"></i>User Information</h2>
    <p class="text-muted">Edit or review complete user data</p>
  </div>

  <!-- User Info Form -->
  <div class="form-container">
    <form method="POST" action="{{ url_for('admin_edit_userinfo', username=user.username) }}">

      <!-- Username -->
      <div class="form-section">
        <h5>Username</h5>
        <input type="text" class="form-control" name="username" value="{{ user.username }}" readonly>
      </div>

      <!-- Personal Details -->
      <div class="form-section">
        <h5>Personal Details</h5>
        <div class="row g-3">
          <div class="col-md-12">
            <input type="text" name="fullname" class="form-control" value="{{ user.fullname }}" placeholder="Full Name">
          </div>
          <div class="col-md-6">
            <input type="date" name="dob" class="form-control" value="{{ user.dob }}">
          </div>
          <div class="col-md-6">
            <select name="gender" class="form-select">
              <option value="Male" {% if user.gender=='Male' %}selected{% endif %}>Male</option>
              <option value="Female" {% if user.gender=='Female' %}selected{% endif %}>Female</option>
              <option value="Others" {% if user.gender=='Others' %}selected{% endif %}>Others</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Account Details -->
      <div class="form-section">
        <h5>Account Details</h5>
        <div class="row g-3">
          <div class="col-md-6">
            <input type="text" name="account_number" class="form-control" value="{{ user.account_number }}"
              placeholder="Account Number">
          </div>
          <div class="col-md-6">
            <input type="text" name="upi_id" class="form-control" value="{{ user.upi_id }}" placeholder="UPI ID">
          </div>
        </div>
      </div>

      <!-- Identification Details -->
      <div class="form-section">
        <h5>Identification</h5>
        <div class="row g-3">
          <div class="col-md-6"><input type="text" name="aadhar" class="form-control" value="{{ user.aadhar }}"
              placeholder="Aadhar Number"></div>
          <div class="col-md-6"><input type="text" name="pan" class="form-control" value="{{ user.pan }}"
              placeholder="PAN Number"></div>
        </div>
      </div>

      <!-- Contact Details -->
      <div class="form-section">
        <h5>Contact Details</h5>
        <div class="row g-3">
          <div class="col-md-6"><input type="text" name="mobile_number" class="form-control"
              value="{{ user.mobile_number }}" placeholder="Mobile Number"></div>
          <div class="col-md-6"><input type="email" name="email_id" class="form-control" value="{{ user.email_id }}"
              placeholder="Email ID"></div>
          <div class="col-12">
            <textarea name="address" rows="6" class="form-control"
              placeholder="Full Address">{{ user.address }}</textarea>
          </div>
        </div>
      </div>

      <!-- Save Button -->
      <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary px-4">Update Info</button>
      </div>

    </form>
  </div>

  <!-- Footer -->
  <div class="footer">
    <p>&copy; SecureTrust Admin Panel. All rights reserved.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
